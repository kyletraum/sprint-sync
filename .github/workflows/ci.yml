name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Gates PRs into main on: the backend build + integration suite (including the
# Principle IX cross-tenant attack and query-filter tests), the web typecheck +
# build, and the idle-cost guard against freshly synthesized infra (P1-6).
jobs:
  backend:
    name: Backend build & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SprintSync.slnx -c Release
      - name: Test
        # Docker is available on the runner, so Testcontainers spins up real SQL.
        # The wall-clock Timing test is excluded from the gate to avoid flakes
        # (P1-11); it still runs locally.
        run: >-
          dotnet test tests/SprintSync.Api.Tests/SprintSync.Api.Tests.csproj
          -c Release --no-build --filter "Category!=Timing"

  web:
    name: Web lint, format, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/sprint-sync-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: jsdom's bundled undici calls webidl.util.markAsUncloneable,
          # which only exists on Node 22+/24 — Node 20 fails to start the vitest worker.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/sprint-sync-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Runs the vitest suite — including the FR-009 hide-existence UI assertion —
      # so a UI enumeration-oracle regression can't land green (P0-1).
      - run: npm run test
      - run: npm run build

  cost-guard:
    name: Idle-cost guard (Deployment & Cost Constraints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no idle-billable resources
        # Runs against the COMMITTED infra/ (what actually deploys) — deterministic
        # and decoupled from the synth step, so a synth hiccup can't turn the cost
        # gate red for unrelated reasons (P1-5). azure.yaml and infra-web/ come
        # from the script's own defaults, so hook-deployed and hand-written
        # templates are classified and checked too (feature 002, US4/T016).
        run: ./scripts/check-idle-cost.sh ./infra
      - name: Verify the guard itself still detects what it claims to
        # A safety mechanism nobody tests is a safety mechanism nobody has. This
        # asserts the guard fails on dead infrastructure, refuses to let an
        # undeployed template satisfy a posture check, rejects a paid Static Web
        # App, stays fail-closed on empty input — and that both twins agree, so a
        # developer's green on Windows is CI's green here (FR-012).
        run: sh tests/cost-guard/run-tests.sh

  infra-drift:
    name: Infra drift check (advisory)
    runs-on: ubuntu-latest
    # Advisory, not gating: `azd infra gen` output varies across azd/Aspire
    # versions, so committed infra/ is the source of truth for deploy and this job
    # only flags when it should be regenerated. azd is pinned to the version that
    # generated committed infra so the diff is meaningful (P2-6); Aspire is pinned
    # via the AppHost SDK (13.4.6).
    #
    # Pin raised 1.19.0 -> 1.31.2 on 2026-08-22: committed infra/ is now generated
    # by 1.31.2, so leaving the pin behind would make this job diff two different
    # generators and warn on every run. (1.19.0 -> 1.31.2 produced a byte-identical
    # tree, so the raise itself changed nothing; the probes and Application
    # Insights in infra/ came from AppHost edits, not from the version bump.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: Azure/setup-azd@v2
        with:
          version: 1.31.2
      - name: Regenerate infra and diff against what's committed
        run: |
          azd env new ci --no-prompt || true
          azd infra gen --force
          git diff --exit-code -- infra \
            || echo "::warning::Committed infra/ differs from 'azd infra gen'; run it and commit."
