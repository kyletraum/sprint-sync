name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Gates PRs into main on: the backend build + integration suite (including the
# Principle IX cross-tenant attack and query-filter tests), the web typecheck +
# build, and the idle-cost guard against freshly synthesized infra (P1-6).
jobs:
  backend:
    name: Backend build & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SprintSync.slnx -c Release
      - name: Test
        # Docker is available on the runner, so Testcontainers spins up real SQL.
        # The wall-clock Timing test is excluded from the gate to avoid flakes
        # (P1-11); it still runs locally.
        run: >-
          dotnet test tests/SprintSync.Api.Tests/SprintSync.Api.Tests.csproj
          -c Release --no-build --filter "Category!=Timing"

  web:
    name: Web lint, format, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/sprint-sync-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/sprint-sync-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Runs the vitest suite — including the FR-009 hide-existence UI assertion —
      # so a UI enumeration-oracle regression can't land green (P0-1).
      - run: npm run test
      - run: npm run build

  cost-guard:
    name: Idle-cost guard (Principle 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no idle-billable resources
        # Runs against the COMMITTED infra/ (what actually deploys) — deterministic
        # and decoupled from the synth step, so a synth hiccup can't turn the cost
        # gate red for unrelated reasons (P1-5).
        run: ./scripts/check-idle-cost.sh ./infra

  infra-drift:
    name: Infra drift check (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: Azure/setup-azd@v2
      - name: Regenerate infra and diff against what's committed
        run: |
          azd env new ci --no-prompt || true
          azd infra gen --force
          git diff --exit-code -- infra \
            || echo "::warning::Committed infra/ differs from 'azd infra gen'; run it and commit."
