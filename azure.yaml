# azd configuration. The Aspire AppHost owns the API + SQL topology and is the
# ONLY azd service — azd forbids pairing an Aspire service with any sibling
# service. The React app is therefore NOT an azd service here; it deploys to
# Static Web Apps Free from CI (see .github/workflows), which also keeps the SPA
# off the Azure Container Apps compute grant (Principle 12, research R8). (P1-4)
name: sprint-sync

services:
  app:
    language: dotnet
    project: ./src/SprintSync.AppHost/SprintSync.AppHost.csproj
    host: containerapp

hooks:
  # Cost backstop: refuse to provision if the synthesized infrastructure would
  # bill while idle (Principle 12). See specs/001-org-tenant-context/quickstart.md.
  preprovision:
    posix:
      shell: sh
      run: ./scripts/check-idle-cost.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/check-idle-cost.ps1
      continueOnError: false
