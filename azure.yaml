# azd configuration. The Aspire AppHost owns the API + SQL topology and is the
# ONLY azd service — azd forbids pairing an Aspire service with any sibling
# service. The React app is therefore NOT an azd service here; it deploys to
# Static Web Apps Free from CI (see .github/workflows), which also keeps the SPA
# off the Azure Container Apps compute grant (Principle 12, research R8). (P1-4)
name: sprint-sync

services:
  app:
    language: dotnet
    project: ./src/SprintSync.AppHost/SprintSync.AppHost.csproj
    host: containerapp

hooks:
  # Cost backstop: refuse to provision if the synthesized infrastructure would
  # bill while idle (Principle 12). See specs/001-org-tenant-context/quickstart.md.
  preprovision:
    posix:
      shell: sh
      # Config guard (real Entra values) then cost guard — fail fast before any
      # resource is created (P1-4, P1-5/T045).
      run: ./scripts/check-azuread-config.sh && ./scripts/check-idle-cost.sh
      continueOnError: false
    windows:
      shell: pwsh
      run: ./scripts/check-azuread-config.ps1 && ./scripts/check-idle-cost.ps1
      continueOnError: false

  # Runtime cost backstop: provision the $1 budget alert with the topology so the
  # spend guard is never a forgotten manual step (P1-6). Skipped (not failed) when
  # BUDGET_ALERT_EMAILS is unset: azd env set BUDGET_ALERT_EMAILS '["you@example.com"]'
  postprovision:
    # NOTE: no `continueOnError` here. It was originally set because the budget
    # backstop is optional, and then the NON-optional Static Web App deployment
    # was appended into the same block — so a failed SWA provision was swallowed
    # and `azd up` reported success with no SPA host (M3, committee round 1-2).
    # Optionality is now expressed per-command instead of for the whole hook.
    posix:
      shell: sh
      run: |
        set -eu

        # OPTIONAL: skipped when unset, and a failure to create it must not fail
        # provisioning — but it must be said out loud, because a silently missing
        # cost backstop is discovered on a bill.
        if [ -n "${BUDGET_ALERT_EMAILS:-}" ]; then
          az deployment group create -g "$AZURE_RESOURCE_GROUP"             -f infra/budget.bicep -p alertEmails="$BUDGET_ALERT_EMAILS"             || echo "WARNING: the budget backstop failed to deploy — spend is unguarded."
        else
          echo "BUDGET_ALERT_EMAILS unset — skipping the cost backstop budget."
        fi

        # NOT optional. Without this there is no SPA host, and deploy-web.yml has
        # nothing to publish to. `set -e` plus no continueOnError means a failure
        # here fails `azd up` loudly, which is the point.
        swa_host=$(az deployment group create -g "$AZURE_RESOURCE_GROUP"           -f infra-web/staticwebapp.bicep           --query 'properties.outputs.defaultHostname.value' -o tsv)
        [ -n "$swa_host" ] || { echo "ERROR: Static Web App reported no hostname."; exit 1; }

        echo "Static Web App: $swa_host"
        echo "Next, so the browser can call the API (FR-030):"
        echo "  azd env set AZURE_CORS_ALLOWED_ORIGINS $swa_host && azd deploy api"
        echo "Then add $swa_host as a redirect URI on the web app registration (FR-031)."
    windows:
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # OPTIONAL — see the posix branch. az is a native executable, so its
        # failures surface as $LASTEXITCODE rather than as terminating errors.
        if ($env:BUDGET_ALERT_EMAILS) {
          az deployment group create -g $env:AZURE_RESOURCE_GROUP `
            -f infra/budget.bicep -p alertEmails=$env:BUDGET_ALERT_EMAILS
          if ($LASTEXITCODE -ne 0) {
            Write-Host "WARNING: the budget backstop failed to deploy - spend is unguarded."
          }
        } else {
          Write-Host "BUDGET_ALERT_EMAILS unset - skipping the cost backstop budget."
        }

        # NOT optional.
        $swaHost = az deployment group create -g $env:AZURE_RESOURCE_GROUP `
          -f infra-web/staticwebapp.bicep `
          --query 'properties.outputs.defaultHostname.value' -o tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($swaHost)) {
          Write-Host "ERROR: Static Web App deployment failed or reported no hostname."
          exit 1
        }

        Write-Host "Static Web App: $swaHost"
        Write-Host "Next, so the browser can call the API (FR-030):"
        Write-Host "  azd env set AZURE_CORS_ALLOWED_ORIGINS $swaHost && azd deploy api"
        Write-Host "Then add $swaHost as a redirect URI on the web app registration (FR-031)."
